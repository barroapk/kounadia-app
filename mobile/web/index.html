<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KOUNADIA</title>
  <meta name="description" content="Scores de football en direct, pronostics et coupons.">
  <meta name="theme-color" content="#120F2E">
  <!-- iPhone : ajout à l'écran d'accueil, plein écran, logo -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KOUNADIA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #120F2E; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font: 600 15px system-ui, -apple-system, sans-serif; color: #A9A3D1; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #2E2866; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #7C3AED; border-radius: 4px;
      animation: k 1.1s ease-in-out infinite; }
    @keyframes k { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="KOUNADIA"><div class="bar"></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
