name: Mettre le site en ligne

on:
  push:
    branches: [main]
    paths: ["site/**", "functions/**", "mobile/web/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Version iPhone (app dans le navigateur, installable sur l'écran d'accueil) ----------
      # Si cette partie échoue, le site et les mises à jour Android sont quand même publiés.
      - uses: subosito/flutter-action@v2
        continue-on-error: true
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Adresse du robot
        continue-on-error: true
        env:
          CF_T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CF_T" "https://api.cloudflare.com/client/v4/accounts/$CF_A/workers/subdomain" | jq -r '.result.subdomain // empty')
          test -n "$SUB" && echo "LIVE_URL=https://kounadia-notif.$SUB.workers.dev" >> "$GITHUB_ENV"
          echo "V=$(jq -r '.version // "1.0.0"' site/version.json)" >> "$GITHUB_ENV"

      - name: Compiler la version iPhone
        id: web
        continue-on-error: true
        working-directory: mobile
        run: |
          flutter pub get
          flutter build web --release --base-href /app/ \
            --dart-define=KD_KEY=${{ secrets.KD_KEY }} \
            --dart-define=APP_VERSION=$V \
            --dart-define=LIVE_URL=$LIVE_URL
          rm -f build/web/flutter_service_worker.js
          rm -rf ../site/app && cp -r build/web ../site/app
          echo "Version iPhone : $(du -sh ../site/app | cut -f1)"

      # ---------- KOUNADIA V2 (essai) pour iPhone : adresse séparée /v2/, la version /app/ ne change pas ----------
      - name: Compiler la version iPhone V2
        continue-on-error: true
        working-directory: mobile
        run: |
          V2=$(jq -r '.version // "2.0.0"' ../site/version-v2.json 2>/dev/null || echo 2.0.0)
          flutter build web --release --base-href /v2/ \
            --dart-define=EDITION=v2 \
            --dart-define=KD_KEY=${{ secrets.KD_KEY }} \
            --dart-define=APP_VERSION=$V2 \
            --dart-define=LIVE_URL=$LIVE_URL
          rm -f build/web/flutter_service_worker.js
          sed -i 's/"name": "KOUNADIA"/"name": "KOUNADIA V2"/; s/"short_name": "KOUNADIA"/"short_name": "KOUNADIA V2"/' build/web/manifest.json
          sed -i 's/content="KOUNADIA"/content="KOUNADIA V2"/g; s/<title>KOUNADIA<\/title>/<title>KOUNADIA V2<\/title>/' build/web/index.html
          rm -rf ../site/v2 && cp -r build/web ../site/v2
          echo "Version iPhone V2 : $(du -sh ../site/v2 | cut -f1)"

      - name: Publier sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Secret CLOUDFLARE_API_TOKEN manquant"; exit 1; }
          test -d site/app || echo "::warning::Version iPhone non compilée : seul le site est publié"
          npx -y wrangler@4 pages project create kounadia --production-branch main 2>/dev/null || true
          npx -y wrangler@4 pages deploy site --project-name kounadia --branch main --commit-dirty=true
