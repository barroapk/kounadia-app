name: Build KOUNADIA APK

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier pour le public (site + avis de mise à jour)"
        type: boolean
        default: false
      type:
        description: "Type : correctif (1.1.0 → 1.1.1), nouveaute (1.1.3 → 1.2.0), majeure (1.4.2 → 2.0.0)"
        type: choice
        options: [correctif, nouveaute, majeure]
        default: correctif
      notes:
        description: "Nouveautés (facultatif)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Installer les dépendances
        working-directory: mobile
        run: flutter pub get

      - name: Vérifier le code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Tests (coupons, pronostics, Coupon du jour et Coups sûrs)
        working-directory: mobile
        run: flutter test test/coupon_engine_test.dart test/tip_eval_test.dart test/v2_test.dart

      - name: Clé de signature
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "Secret KEYSTORE_B64 manquant"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/kounadia.p12"

      - name: Numéro de version (MAJEUR.MINEUR.CORRECTIF)
        env:
          GH_TOKEN: ${{ github.token }}
          TYPE: ${{ inputs.type }}
        run: |
          # Part de la dernière version publiée (ex. v1.0.10) et monte selon le type choisi.
          LAST=$(gh release list -R "${{ github.repository }}" --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[0].tagName')
          X=1; Y=0; Z=0
          if [[ "$LAST" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            X=${BASH_REMATCH[1]}; Y=${BASH_REMATCH[2]}; Z=${BASH_REMATCH[3]}
          fi
          case "${TYPE:-correctif}" in
            majeure) X=$((X + 1)); Y=0; Z=0 ;;
            nouveaute) Y=$((Y + 1)); Z=0 ;;
            *) Z=$((Z + 1)) ;;
          esac
          echo "V=$X.$Y.$Z" >> "$GITHUB_ENV"
          echo "Dernière : ${LAST:-aucune} → nouvelle : $X.$Y.$Z (${TYPE:-correctif})"

      - name: Identifiants Firebase (notifications)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GS" || { echo "Secret GOOGLE_SERVICES_JSON manquant"; exit 1; }
          C='.client[] | select(.client_info.android_client_info.package_name=="com.kounadia.kounadia")'
          echo "FB_API_KEY=$(echo "$GS" | jq -r "$C | .api_key[0].current_key")" >> "$GITHUB_ENV"
          echo "FB_APP_ID=$(echo "$GS" | jq -r "$C | .client_info.mobilesdk_app_id")" >> "$GITHUB_ENV"
          echo "FB_SENDER=$(echo "$GS" | jq -r '.project_info.project_number')" >> "$GITHUB_ENV"
          echo "FB_PROJECT=$(echo "$GS" | jq -r '.project_info.project_id')" >> "$GITHUB_ENV"

      - name: Adresse du robot (direct en temps réel)
        env:
          CF_T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CF_T" "https://api.cloudflare.com/client/v4/accounts/$CF_A/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -n "$SUB" ]; then echo "LIVE_URL=https://kounadia-notif.$SUB.workers.dev" >> "$GITHUB_ENV"; echo "Robot : kounadia-notif.$SUB.workers.dev"; else echo "::warning::Sous-domaine workers.dev introuvable : direct par le site (30 s)"; fi

      - name: Sons des notifications (créés par calcul, sans fichier externe)
        run: |
          python3 -m pip install --quiet --break-system-packages numpy scipy 2>/dev/null || python3 -m pip install --quiet numpy scipy
          python3 tools/sons/sons.py mobile/android/app/src/main/res/raw

      - name: Compiler l'APK (mode release)
        working-directory: mobile
        env:
          KOUNADIA_KEYSTORE: ${{ runner.temp }}/kounadia.p12
          KOUNADIA_KEY_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --build-name=$V --build-number=${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols
          --dart-define=KD_KEY=${{ secrets.KD_KEY }}
          --dart-define=APP_VERSION=$V
          --dart-define=APP_BUILD=${{ github.run_number }}
          --dart-define=FB_API_KEY=$FB_API_KEY
          --dart-define=FB_APP_ID=$FB_APP_ID
          --dart-define=FB_SENDER=$FB_SENDER
          --dart-define=FB_PROJECT=$FB_PROJECT
          --dart-define=LIVE_URL=$LIVE_URL

      - name: Vérifier la signature
        run: |
          AS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$AS" verify --print-certs mobile/build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/sig.txt"
          head -3 "$RUNNER_TEMP/sig.txt"
          grep -q "KOUNADIA SERVICE" "$RUNNER_TEMP/sig.txt" || { echo "APK non signé avec la clé KOUNADIA"; exit 1; }

      - name: Publier l'APK comme résultat téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: kounadia-apk
          retention-days: 2
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      # Clés pour relire les plantages (code obfusqué) : gardées 90 jours, par numéro de build.
      - name: Symboles des plantages
        uses: actions/upload-artifact@v4
        with:
          name: kounadia-symbols-${{ github.run_number }}
          retention-days: 90
          path: mobile/build/symbols

      - name: Publier la version (site + avis de mise à jour)
        if: ${{ inputs.publier }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          B=${{ github.run_number }}
          cp mobile/build/app/outputs/flutter-apk/app-release.apk kounadia.apk
          SIZE=$(stat -c %s kounadia.apk)
          gh release create "v$V" kounadia.apk --title "KOUNADIA $V" --notes "${NOTES:-Améliorations et corrections.}" --latest
          mkdir -p site
          printf '{"version":"%s","build":%s,"size":%s,"date":"%s","url":"https://kounadia.pages.dev/telecharger"}\n' "$V" "$B" "$SIZE" "$(date -u +%Y-%m-%d)" > site/version.json
          git config user.name "barroapk"
          git config user.email "barroapk@users.noreply.github.com"
          git add site/version.json
          git commit -m "Version $V publiée"
          git -c rebase.autoStash=true pull --rebase -q
          git push
          gh workflow run deploy-site.yml
          echo "Publié : KOUNADIA $V ($SIZE octets)"
