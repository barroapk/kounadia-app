name: Build KOUNADIA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Installer les dépendances
        working-directory: mobile
        run: flutter pub get

      - name: Clé de signature
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "Secret KEYSTORE_B64 manquant"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/kounadia.p12"

      - name: Compiler l'APK (mode release)
        working-directory: mobile
        env:
          KOUNADIA_KEYSTORE: ${{ runner.temp }}/kounadia.p12
          KOUNADIA_KEY_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --obfuscate --split-debug-info=build/symbols --dart-define=KD_KEY=${{ secrets.KD_KEY }}

      - name: Vérifier la signature
        run: |
          keytool -printcert -jarfile mobile/build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256:" | head -2
          keytool -printcert -jarfile mobile/build/app/outputs/flutter-apk/app-release.apk | grep -q "KOUNADIA SERVICE" || { echo "APK non signé avec la clé KOUNADIA"; exit 1; }

      - name: Publier l'APK comme résultat téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: kounadia-apk
          retention-days: 2
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
