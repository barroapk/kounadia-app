name: Build KOUNADIA V2 (essai)

# KOUNADIA V2 : application séparée (s'installe à côté de KOUNADIA, sans la remplacer).
# Même compte, même Premium. L'APK et la version iPhone de KOUNADIA (V1) ne sont pas touchés.
on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier sur le site (APK V2 + avis de mise à jour V2)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Installer les dépendances
        working-directory: mobile
        run: flutter pub get

      - name: Vérification du code (erreurs)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Tests
        working-directory: mobile
        run: flutter test test/coupon_engine_test.dart test/tip_eval_test.dart test/v2_test.dart

      - name: Clé de signature
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "Secret KEYSTORE_B64 manquant"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/kounadia.p12"

      - name: Application séparée « KOUNADIA V2 »
        run: |
          # Identifiant différent : V1 et V2 restent installées côte à côte.
          sed -i 's/applicationId = "com.kounadia.kounadia"/applicationId = "com.kounadia.kounadia.v2"/' mobile/android/app/build.gradle.kts
          sed -i 's/android:label="KOUNADIA"/android:label="KOUNADIA V2"/' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'com.kounadia.kounadia.v2' mobile/android/app/build.gradle.kts || { echo "Identifiant V2 non appliqué"; exit 1; }
          grep -q 'KOUNADIA V2' mobile/android/app/src/main/AndroidManifest.xml || { echo "Nom V2 non appliqué"; exit 1; }
          echo "V=2.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Adresse du robot
        env:
          CF_T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CF_T" "https://api.cloudflare.com/client/v4/accounts/$CF_A/workers/subdomain" | jq -r '.result.subdomain // empty')
          test -n "$SUB" || { echo "Robot introuvable : la V2 a besoin du robot (Premium)"; exit 1; }
          echo "LIVE_URL=https://kounadia-notif.$SUB.workers.dev" >> "$GITHUB_ENV"

      - name: Compiler l'APK V2
        working-directory: mobile
        env:
          KOUNADIA_KEYSTORE: ${{ runner.temp }}/kounadia.p12
          KOUNADIA_KEY_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --build-name=$V --build-number=${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols
          --dart-define=EDITION=v2
          --dart-define=KD_KEY=${{ secrets.KD_KEY }}
          --dart-define=APP_VERSION=$V
          --dart-define=APP_BUILD=${{ github.run_number }}
          --dart-define=LIVE_URL=$LIVE_URL

      - name: Vérifier la signature et l'identifiant
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          APK=mobile/build/app/outputs/flutter-apk/app-release.apk
          "${BT}apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/sig.txt"
          grep -q "KOUNADIA SERVICE" "$RUNNER_TEMP/sig.txt" || { echo "APK non signé avec la clé KOUNADIA"; exit 1; }
          "${BT}aapt2" dump badging "$APK" > "$RUNNER_TEMP/badge.txt"
          grep -q "package: name='com.kounadia.kounadia.v2'" "$RUNNER_TEMP/badge.txt" || { echo "Mauvais identifiant"; exit 1; }

      - name: APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: kounadia-v2-apk
          retention-days: 3
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Symboles des plantages
        uses: actions/upload-artifact@v4
        with:
          name: kounadia-v2-symbols-${{ github.run_number }}
          retention-days: 90
          path: mobile/build/symbols

      - name: Publier la V2 (site + avis de mise à jour V2)
        if: ${{ inputs.publier }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=${{ github.run_number }}
          cp mobile/build/app/outputs/flutter-apk/app-release.apk kounadia-v2.apk
          SIZE=$(stat -c %s kounadia-v2.apk)
          # Publication V2 à part : ne devient jamais la « dernière version » de KOUNADIA (V1).
          gh release delete v2-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create v2-apk kounadia-v2.apk --title "KOUNADIA V2 $V (essai)" --notes "Version d'essai KOUNADIA V2." --prerelease --latest=false
          git checkout -- mobile/android
          printf '{"version":"%s","build":%s,"size":%s,"date":"%s","url":"https://kounadia.pages.dev/telecharger-v2"}\n' "$V" "$B" "$SIZE" "$(date -u +%Y-%m-%d)" > site/version-v2.json
          git config user.name "barroapk"
          git config user.email "barroapk@users.noreply.github.com"
          git add site/version-v2.json
          git commit -m "KOUNADIA V2 $V publiée"
          git -c rebase.autoStash=true pull --rebase -q
          git push
          gh workflow run deploy-site.yml
          echo "Publié : KOUNADIA V2 $V ($SIZE octets)"
