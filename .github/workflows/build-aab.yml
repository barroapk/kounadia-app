name: Build KOUNADIA Play Store (AAB)

# Version Play Store uniquement : ne touche ni au site, ni à l'APK, ni à l'avis de mise à jour.
# Paiement en pause, pas de mise à jour hors Play Store, pas de service 1xBet (STORE=play).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Installer les dépendances
        working-directory: mobile
        run: flutter pub get

      - name: Tests du moteur de coupons
        working-directory: mobile
        run: flutter test test/coupon_engine_test.dart test/tip_eval_test.dart

      - name: Clé de signature (clé d'importation Play Store)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "Secret KEYSTORE_B64 manquant"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/kounadia.p12"

      - name: Numéro de version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Même nom de version que la dernière publiée sur le site ; numéro de build propre au Play Store.
          LAST=$(gh release list -R "${{ github.repository }}" --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')
          V="${LAST#v}"; [ -n "$V" ] || V=1.0.0
          echo "V=$V" >> "$GITHUB_ENV"
          echo "CODE=$((10000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "Version Play Store : $V (code $((10000 + ${{ github.run_number }})))"

      - name: Retirer l'installation d'APK (interdite sur le Play Store)
        run: |
          sed -i '/REQUEST_INSTALL_PACKAGES/d' mobile/android/app/src/main/AndroidManifest.xml
          ! grep -q REQUEST_INSTALL_PACKAGES mobile/android/app/src/main/AndroidManifest.xml

      - name: Identifiants Firebase (notifications)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GS" || { echo "Secret GOOGLE_SERVICES_JSON manquant"; exit 1; }
          C='.client[] | select(.client_info.android_client_info.package_name=="com.kounadia.kounadia")'
          echo "FB_API_KEY=$(echo "$GS" | jq -r "$C | .api_key[0].current_key")" >> "$GITHUB_ENV"
          echo "FB_APP_ID=$(echo "$GS" | jq -r "$C | .client_info.mobilesdk_app_id")" >> "$GITHUB_ENV"
          echo "FB_SENDER=$(echo "$GS" | jq -r '.project_info.project_number')" >> "$GITHUB_ENV"
          echo "FB_PROJECT=$(echo "$GS" | jq -r '.project_info.project_id')" >> "$GITHUB_ENV"

      - name: Adresse du robot (direct en temps réel)
        env:
          CF_T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CF_T" "https://api.cloudflare.com/client/v4/accounts/$CF_A/workers/subdomain" | jq -r '.result.subdomain // empty')
          test -n "$SUB" && echo "LIVE_URL=https://kounadia-notif.$SUB.workers.dev" >> "$GITHUB_ENV"

      - name: Compiler l'AAB (Android App Bundle) signé
        working-directory: mobile
        env:
          KOUNADIA_KEYSTORE: ${{ runner.temp }}/kounadia.p12
          KOUNADIA_KEY_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: >
          flutter build appbundle --release
          --build-name=$V --build-number=$CODE
          --obfuscate --split-debug-info=build/symbols
          --dart-define=STORE=play
          --dart-define=KD_KEY=${{ secrets.KD_KEY }}
          --dart-define=APP_VERSION=$V
          --dart-define=APP_BUILD=$CODE
          --dart-define=FB_API_KEY=$FB_API_KEY
          --dart-define=FB_APP_ID=$FB_APP_ID
          --dart-define=FB_SENDER=$FB_SENDER
          --dart-define=FB_PROJECT=$FB_PROJECT
          --dart-define=LIVE_URL=$LIVE_URL

      - name: Vérifier la signature
        run: |
          keytool -printcert -jarfile mobile/build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/sig.txt"
          head -5 "$RUNNER_TEMP/sig.txt"
          grep -q "KOUNADIA SERVICE" "$RUNNER_TEMP/sig.txt" || { echo "AAB non signé avec la clé KOUNADIA"; exit 1; }

      - name: Préparer le fichier
        run: cp mobile/build/app/outputs/bundle/release/app-release.aab "kounadia-play-$V.aab"

      - name: AAB téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: kounadia-play-aab
          retention-days: 7
          path: kounadia-play-*.aab

      - name: Symboles des plantages (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: kounadia-play-symbols-${{ env.CODE }}
          retention-days: 90
          path: mobile/build/symbols
