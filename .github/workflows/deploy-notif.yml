name: Robot notifications (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["notif/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déployer le robot sur Cloudflare
        working-directory: notif
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCM_SA: ${{ secrets.FCM_SA }}
          KD_KEY: ${{ secrets.KD_KEY }}
          PK_KEY: ${{ secrets.PK_KEY }}
          TICKET_SECRET: ${{ secrets.TICKET_SECRET }}
          GH_DISPATCH: ${{ secrets.GH_DISPATCH }}
          BACKUP_CRON_SECRET: ${{ secrets.BACKUP_CRON_SECRET }}
        run: |
          test -n "$FCM_SA" || { echo "Secret FCM_SA manquant"; exit 1; }
          test -n "$KD_KEY" || { echo "Secret KD_KEY manquant"; exit 1; }
          npx -y wrangler@4 deploy
          printf '%s' "$FCM_SA" | npx -y wrangler@4 secret put FCM_SA
          printf '%s' "$KD_KEY" | npx -y wrangler@4 secret put KD_KEY
          # Contenu Premium : clé Premium et secret des tickets (jamais dans l'app).
          if [ -n "$PK_KEY" ]; then printf '%s' "$PK_KEY" | npx -y wrangler@4 secret put PK_KEY; fi
          if [ -n "$TICKET_SECRET" ]; then printf '%s' "$TICKET_SECRET" | npx -y wrangler@4 secret put TICKET_SECRET; fi
          # Jeton GitHub (Actions de kfeed seulement) : le robot relance scores, Coup sûr et pronostics.
          if [ -n "$GH_DISPATCH" ]; then printf '%s' "$GH_DISPATCH" | npx -y wrangler@4 secret put GH_DISPATCH; fi
          # Secret de la sauvegarde nocturne de la base (le robot la lance chaque nuit).
          if [ -n "$BACKUP_CRON_SECRET" ]; then printf '%s' "$BACKUP_CRON_SECRET" | npx -y wrangler@4 secret put BACKUP_CRON_SECRET; fi
          echo "Robot en ligne : il démarre tout seul dans la minute."
