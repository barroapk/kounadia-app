name: Bootstrap Flutter Project

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Régénérer les dossiers android/ios avec la bonne configuration
        run: |
          rm -rf mobile/android mobile/ios
          flutter create --org com.kounadia --project-name kounadia mobile

      - name: Sauvegarder le résultat dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/
          git diff --staged --quiet || git commit -m "Fix: régénération android/ios avec Flutter 3.44.8"
          git push
