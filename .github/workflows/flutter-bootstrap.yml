name: Bootstrap Flutter Project

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Créer le projet Flutter s'il n'existe pas encore
        run: |
          if [ ! -d "mobile/android" ]; then
            flutter create --org com.kounadia --project-name kounadia mobile
          fi

      - name: Sauvegarder le squelette généré dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/
          git diff --staged --quiet || git commit -m "Bootstrap: squelette Flutter généré automatiquement"
          git push